<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master HTML</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  .tab {
    overflow: hidden;
    border: 1px solid #ccc;
    background-color: #f1f1f1;
  }
  .tab button {
    background-color: inherit;
    float: left;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 14px 16px;
    transition: 0.3s;
    font-size: 17px;
  }
  .tab button:hover {
    background-color: #ddd;
  }
  .tab button.active {
    background-color: #ccc;
  }
  .tabcontent {
    display: none;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-top: none;
  }
  iframe {
    width: 100%;
    height: 500px; /* Adjust as needed */
    border: none;
  }
</style>
</head>
<body>

<h2>Master Tab Interface</h2>
<p>Click on the buttons inside the tabbed menu:</p>

<div class="tab">
  <button class="tablinks" onclick="openTab(event, 'Tab1')" id="defaultOpen">Tab 1</button>
  <button class="tablinks" onclick="openTab(event, 'Tab2')">Tab 2</button>
  <button class="tablinks" onclick="openTab(event, 'Tab3')">Tab 3</button>
  <button class="tablinks" onclick="openTab(event, 'Tab4')">Tab 4</button>
  <button class="tablinks" onclick="openTab(event, 'Tab5')">Tab 5</button>
</div>

<div id="Tab1" class="tabcontent">
  <h3>Tab 1</h3>
  <!-- Paste content of HTML 1 here, or use an iframe like below -->
  <!-- <iframe src="file1.html"></iframe> -->
  <p>Content for HTML 1 goes here.</p>
</div>

<div id="Tab2" class="tabcontent">
  <h3>Tab 2</h3>
  <!-- Paste content of HTML 2 here -->
  <p>Content for HTML 2 goes here.</p>
</div>

<div id="Tab3" class="tabcontent">
  <h3>Tab 3</h3>
  <!-- Paste content of HTML 3 here -->
  <p>Content for HTML 3 goes here.</p>
</div>

<div id="Tab4" class="tabcontent">
  <h3>Tab 4</h3>
  <!-- Paste content of HTML 4 here -->
  <p>Content for HTML 4 goes here.</p>
</div>

<div id="Tab5" class="tabcontent">
  <h3>Tab 5</h3>
  <!-- Paste content of HTML 5 here -->
  <p>Content for HTML 5 goes here.</p>
</div>

<script>
function openTab(evt, tabName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById(tabName).style.display = "block";
  evt.currentTarget.className += " active";
}

// Get the element with id="defaultOpen" and click on it
document.getElementById("defaultOpen").click();
</script>

</body>
</html>
