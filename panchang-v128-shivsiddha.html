window.calculateYatraKundali = function() {
    let dateStr = document.getElementById('yatraBirthDate').value;
    let timeStr = document.getElementById('yatraBirthTime').value;
    let lat = parseFloat(document.getElementById('yatraLat').value);
    let lng = parseFloat(document.getElementById('yatraLng').value);

    if (!dateStr || !timeStr || isNaN(lat) || isNaN(lng)) {
        alert("Please fill out all birth details.");
        return;
    }

    let [year, month, day] = dateStr.split('-').map(Number);
    let [hours, mins] = timeStr.split(':').map(Number);

    // We must parse based on the location's timezone to be truly 100% perfect regardless of browser timezone
    let tzOffset = 5.5; // Default IST
    let country = document.getElementById('yatraBirthCountry').value;
    let city = document.getElementById('yatraBirthCity').value;
    if (CITY_DATABASE[country] && CITY_DATABASE[country][city]) {
        tzOffset = CITY_DATABASE[country][city].tz;
    }

    // Create Date explicitly in UTC mapped from the timezone
    let localTotalMinutes = hours * 60 + mins;
    let utcTotalMinutes = localTotalMinutes - (tzOffset * 60);
    let d = new Date(Date.UTC(year, month - 1, day, 0, Math.round(utcTotalMinutes), 0));


    let astroTime = Astronomy.MakeTime(d);

    // Calculate Ascendant (Lagna)

    let gmst_hours = Astronomy.SiderealTime(d);
    let lst = (gmst_hours * 15 + lng) % 360;

    // Obliquity of the ecliptic (approximate true obliquity)
    // Astronomy engine has `Astronomy.EclipticLongitude` or we can just use 23.439
    let obliquity = 23.4392911;
    let lstRad = lst * (Math.PI / 180);
    let obRad = obliquity * (Math.PI / 180);
    let latRad = lat * (Math.PI / 180);

    let ascendantAngleRad = Math.atan2(Math.cos(lstRad), -Math.sin(lstRad) * Math.cos(obRad) - Math.tan(latRad) * Math.sin(obRad));
    let ascendantLong = (ascendantAngleRad * (180 / Math.PI) + 360) % 360;
    let ayanamsha = getLahiriAyanamsha(d);
    let siderealAscendant = (ascendantLong - ayanamsha + 360) % 360;

    let ascendantRashiIdx = Math.floor(siderealAscendant / 30);

    // Calculate natal planets
    let planetsList = [
        Astronomy.Body.Sun, Astronomy.Body.Moon, Astronomy.Body.Mars,
        Astronomy.Body.Mercury, Astronomy.Body.Jupiter, Astronomy.Body.Venus,
        Astronomy.Body.Saturn
    ];
    let natalPlanets = [];
    planetsList.forEach(body => {


        let tropicalLon = getEclipticLon(body, astroTime);
        let siderealLon = (tropicalLon - ayanamsha + 360) % 360;


        var rIdx = Math.floor(siderealLon / 30);
        natalPlanets.push({
            name: body,
            lon: siderealLon,
            rashiIndex: rIdx,
            rashiDegree: siderealLon % 30
        });
    });

    // Nodes (Approx mean nodes)
    let jd = astroTime.tt;
    let dDays = jd - 2451545.0;
    let omega = 125.04452 - 0.0529537648 * dDays;
    let trueRahu = (omega - ayanamsha + 360) % 360;
    trueRahu = (trueRahu + 360) % 360;
    let trueKetu = (trueRahu + 180) % 360;
    natalPlanets.push({ name: 'Rahu', lon: trueRahu, rashiIndex: Math.floor(trueRahu / 30), rashiDegree: trueRahu % 30 });
    natalPlanets.push({ name: 'Ketu', lon: trueKetu, rashiIndex: Math.floor(trueKetu / 30), rashiDegree: trueKetu % 30 });

    window.globalYatraNatalData = {
        lagnaRashiIdx: ascendantRashiIdx,
        moonRashiIdx: natalPlanets.find(p => p.name === Astronomy.Body.Moon).rashiIndex,
        planets: natalPlanets
    };

    document.getElementById('yatraKundaliContainer').innerHTML = renderNorthIndianKundali(ascendantRashiIdx, natalPlanets);
    updateYatraEvaluatedCalendar();
};



function getSunsetTime(dateObj, lat, lng) {
    let obs = new Astronomy.Observer(lat, lng, 0);
    // Start search from midday to find next sunset
    let startD = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), 12, 0, 0);
    let astroTime = Astronomy.MakeTime(startD);
    let sunset = Astronomy.SearchRiseSet("Sun", obs, -1, astroTime, 1);
    return sunset ? sunset.date : null;
}

function getSunriseTime(dateObj, lat, lng) {
    let obs = new Astronomy.Observer(lat, lng, 0);
    // Start search from midnight local time
    let startD = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), 0, 0, 0);
    let astroTime = Astronomy.MakeTime(startD);
    let sunrise = Astronomy.SearchRiseSet("Sun", obs, +1, astroTime, 1);
    if (sunrise) {
        return sunrise.date;
    }
    // Fallback to 6:00 AM local if algorithm fails (e.g. extreme latitudes)
    return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), 6, 0, 0);
}

function getTravelTimeLagna(dateObj, lat, lng) {
    let astroTime = Astronomy.MakeTime(dateObj);
    let gmst_hours = Astronomy.SiderealTime(dateObj);
    let lst = (gmst_hours * 15 + lng) % 360;
    let obliquity = 23.4392911;
    let lstRad = lst * (Math.PI / 180);
    let obRad = obliquity * (Math.PI / 180);
    let latRad = lat * (Math.PI / 180);
    let ascendantAngleRad = Math.atan2(Math.cos(lstRad), -Math.sin(lstRad) * Math.cos(obRad) - Math.tan(latRad) * Math.sin(obRad));
    let ascendantLong = (ascendantAngleRad * (180 / Math.PI) + 360) % 360;
    let ayanamsha = getLahiriAyanamsha(dateObj);
    let siderealAscendant = (ascendantLong - ayanamsha + 360) % 360;
    return Math.floor(siderealAscendant / 30);
}

function getShunyaLagnaForMonth(amantaMonthName) {
    if (!amantaMonthName) return null;
    let m = amantaMonthName.split(' ')[0];
    if (m.includes('चैत्र')) return 10; // Kumbha (0-indexed: 10)
    if (m.includes('वैशाख')) return 11; // Meena
    if (m.includes('ज्येष्ठ')) return 1; // Vrishabha
    if (m.includes('आषाढ़')) return 2; // Mithuna
    if (m.includes('श्रावण')) return 0; // Mesha
    if (m.includes('भाद्रपद')) return 5; // Kanya
    if (m.includes('आश्विन')) return 7; // Vrishchika
    if (m.includes('कार्तिक')) return 6; // Tula
    if (m.includes('मार्गशीर्ष')) return 8; // Dhanu
    if (m.includes('पौष')) return 3; // Karka
    if (m.includes('माघ')) return 9; // Makara
    if (m.includes('फाल्गुन')) return 4; // Simha
    return null;
}

function getDagdhaLagnasForTithi(tithiNumber) {
    // 0: Mesha, 1: Vrishabha, 2: Mithuna, 3: Karka, 4: Simha, 5: Kanya, 6: Tula, 7: Vrishchika, 8: Dhanu, 9: Makara, 10: Kumbha, 11: Meena
    if (tithiNumber === 1) return [6, 9]; // Tula, Makara
    if (tithiNumber === 3) return [4, 9]; // Simha, Makara
    if (tithiNumber === 5) return [2, 5]; // Mithuna, Kanya
    if (tithiNumber === 7) return [3, 8]; // Karka, Dhanu
    if (tithiNumber === 9) return [3, 4]; // Karka, Simha
    if (tithiNumber === 11) return [8, 11]; // Dhanu, Meena
    if (tithiNumber === 13) return [1, 11]; // Vrishabha, Meena
    return [];
}


// Function to calculate start and end times of a specific Lagna for a given date
function getLagnaTiming(dateObj, lat, lng, targetLagnaIdx) {
    let start = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), 0, 0, 0);
    let currentLagnaIdx = getTravelTimeLagna(start, lat, lng);

    // Scan through the day (24 hours) in 5-minute increments
    let lagnaFound = false;
    let lagnaStart = null;
    let lagnaEnd = null;

    for (let m = 0; m < 24 * 60; m += 5) {
        let testDate = new Date(start.getTime() + m * 60000);
        let idx = getTravelTimeLagna(testDate, lat, lng);

        if (idx === targetLagnaIdx && !lagnaFound) {
            lagnaFound = true;
            lagnaStart = testDate;
        } else if (idx !== targetLagnaIdx && lagnaFound) {
            lagnaEnd = testDate;
            break; // Found the window
        }
    }

    // If it started before midnight and ends today
    if (lagnaFound && !lagnaStart) {
        lagnaStart = start;
    }

    // If it crosses midnight into the next day
    if (lagnaFound && !lagnaEnd) {
         for (let m = 24 * 60; m < 48 * 60; m += 5) {
            let testDate = new Date(start.getTime() + m * 60000);
            let idx = getTravelTimeLagna(testDate, lat, lng);
            if (idx !== targetLagnaIdx) {
                lagnaEnd = testDate;
                break;
            }
         }
    }

    return { start: lagnaStart, end: lagnaEnd };
}

                    <div style="margin-bottom: 8px; font-size: 13px; color: var(--text-main);">

                }

                if (vastraRules.shatabhishaRestricted) {

                        <strong style="color: var(--red-ashubh);">⚠️ कुछ आचार्यों के मतानुसार:</strong> शतभिषा नक्षत्र में सधवा स्त्री नवीन वस्त्र-आभूषण आदि का धारण और स्नान न करे।<br>

                vastraHtml += '</div>';
                return vastraHtml;

            ${(() => {
                let sc = window.analyzeShubhaChandra(p);

                let shubhaColor = sc.isShubha ? 'var(--green-shubh)' : (sc.isAfflicted ? 'var(--red-ashubh)' : 'var(--amber-mixed)');
                let shubhaText = sc.isShubha ? 'शुभ चंद्र (Shubha Chandra)' : (sc.isAfflicted ? 'अशुभ/पीड़ित चंद्र (Afflicted Moon)' : 'मिश्रित चंद्र (Mixed Moon)');

                if(sc.reasons.length > 0) details += '<br><span style="color:var(--green-shubh); font-size:12px;">+ ' + sc.reasons.join(', ') + '</span>';
                if(sc.warnings.length > 0) details += '<br><span style="color:var(--red-ashubh); font-size:12px;">- ' + sc.warnings.join(', ') + '</span>';

                return `<div style="margin-top:10px; padding:10px; background:#f9f9f9; border-radius:6px; border:1px solid #eee;">
                    <strong>चंद्र स्थिति (Moon Status):</strong> <span style="color:${shubhaColor}; font-weight:bold;">${shubhaText}</span>
                    ${details}
                </div>`;

            ${natalDetailsHtml}
            <hr style="margin: 15px 0;">
            ${detailsHtml}

            <hr style="margin: 15px 0; border-top: 2px solid var(--primary-light);">
            <h2 style="text-align:center;">उस दिन की यात्रा कुंडली</h2>
            ${window.globalYatraNatalData ? planetTableHtml + renderNorthIndianKundali(travelLagnaIdx, travelTransits) : '<div style="text-align:center; padding: 20px; color: var(--red-ashubh); font-weight: bold; border: 1px dashed var(--red-ashubh); margin: 10px; border-radius: 8px;">कृपया यात्रा कुंडली देखने के लिए ऊपर अपनी जन्म विवरण भरकर <strong>Calculate Yatra Kundali</strong> बटन पर क्लिक करें।</div>'}

    </div>`;

    document.body.insertAdjacentHTML('beforeend', html);
}



window.goToToday = function() {
    let now = new Date();
    document.getElementById('calYear').value = now.getFullYear();
    document.getElementById('calMonth').value = now.getMonth();

    let yfYear = document.getElementById('yfYear');
    if (yfYear) yfYear.value = now.getFullYear();
    let yfMonth = document.getElementById('yfMonth');
    if (yfMonth) yfMonth.value = now.getMonth();

    updateCalendar();
};

window.updateCalendar = function() {
    let y = parseInt(document.getElementById('calYear').value);
    let m = parseInt(document.getElementById('calMonth').value);
    document.getElementById('mainCalendarContainer').innerHTML = renderMonthlyCalendar(y, m);

    // Sync Yoga Finder
    document.getElementById('yfYear').value = y;
    document.getElementById('yfMonth').value = m;
    updateYogaFinderDropdowns();


};


window.changeMonth = function(dir) {
    let m = parseInt(document.getElementById('calMonth').value);
    let y = parseInt(document.getElementById('calYear').value);
    m += dir;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    document.getElementById('calMonth').value = m;
    document.getElementById('calYear').value = y;
    updateCalendar();
};


window.updateYogaFinderDropdowns = function() {
    let year = parseInt(document.getElementById('yfYear').value);
    let month = parseInt(document.getElementById('yfMonth').value);

    if (month !== -1) {
        document.getElementById('calYear').value = year;
        document.getElementById('calMonth').value = month;
        document.getElementById('mainCalendarContainer').innerHTML = renderMonthlyCalendar(year, month);
    }

    let startMonth = month === -1 ? 0 : month;
    let endMonth = month === -1 ? 11 : month;

    window.yfCurrentMonthData = [];
    let availableYogas = new Set();

    for (let m = startMonth; m <= endMonth; m++) {
        let date = new Date(year, m, 1, 6, 0, 0);
        while (date.getMonth() === m) {
        let lat = 28.6139; let lng = 77.2090;
        if (window.globalYatraNatalData && document.getElementById('yatraLat')) {
            lat = parseFloat(document.getElementById('yatraLat').value) || lat;
            lng = parseFloat(document.getElementById('yatraLng').value) || lng;
        }
        let sunriseDate = getSunriseTime(date, lat, lng);
        let p = new PanchangEngine(sunriseDate);
        let ygs = calculateDailyYogas(p);

        let dayData = {
            dateObj: new Date(date),
            panchang: p,
            yogas: ygs,
            isSampurnaShubh: false
        };

        // Sampurna Shubh Divas logic: Must have NO ashubh yogas, and at least one Shubh yoga.
        let ashubhCount = ygs.filter(y => y.type === 'ashubh').length;
        let shubhCount = ygs.filter(y => y.type === 'shubh').length;

        if (ashubhCount === 0 && shubhCount > 0) {
            availableYogas.add("सम्पूर्ण शुभ दिवस (Sampurna Shubh Divas)");
            dayData.isSampurnaShubh = true;
        }

        window.yfCurrentMonthData.push(dayData);
        date.setDate(date.getDate() + 1);
        }
    }

    // Statically define all possible Shubh yogas so the user can always search for them
    let allYogas = [
        "सम्पूर्ण शुभ दिवस (Sampurna Shubh Divas)",
        "द्विपुष्कर योग (Dwipushkar Yoga)",
        "त्रिपुष्कर योग (Tripushkar Yoga)",
        "आनन्दादि योग",
        "सिद्धि योग (Siddhi Yoga)",
        "सर्वार्थ सिद्धि योग (Sarvartha Siddhi Yoga)",
        "अमृत सिद्धि योग (Amrit Siddhi Yoga)",
        "रवि पुष्य योग (Ravi Pushya Yoga)",
        "गुरु पुष्य योग (Guru Pushya Yoga)",
        "कुमार योग (Kumar Yoga)",
        "राजयोग (Rajyoga)",
        "पुष्कर योग (Pushkar Yoga)",
        "सिद्धयोग",
        "रवि योग (Ravi Yoga)"
    ];
    let currentlySelected = document.getElementById('yfYoga').value;
    let yogaList = allYogas;

    let select = document.getElementById('yfYoga');
    select.innerHTML = yogaList.map((y, i) => `<option value="${y}" ${y === currentlySelected ? 'selected' : ''}>${y}</option>`).join('');

    renderYogaFinderResults();
};

window.renderYogaFinderResults = function() {
    let select = document.getElementById('yfYoga');
    let resContainer = document.getElementById('yfResults');

    if (!select.value || !window.yfCurrentMonthData) {
        resContainer.innerHTML = '';
        return;
    }

    let selectedYoga = select.value;
    let matchingDays = window.yfCurrentMonthData.filter(d => {
        if (selectedYoga === "सम्पूर्ण शुभ दिवस (Sampurna Shubh Divas)") {
            return d.isSampurnaShubh || d.yogas.some(y => y.name && y.name.includes('रवि योग'));
        }
        return d.yogas.some(y => y.name.startsWith(selectedYoga));
    });

    if (matchingDays.length === 0) {
        resContainer.innerHTML = `<p>No matches found.</p>`;
        return;
    }

    let tableHtml = `
    <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; text-align:left; font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,0.05); border-radius:8px; overflow:hidden;">
            <thead>
                <tr style="background:var(--primary-color); color:#fff;">
                    <th style="padding:10px;">तारीख (Date)</th>
                    <th style="padding:10px;">अन्य योग (Other Yogas)</th>
                </tr>
            </thead>
            <tbody>
    `;

    matchingDays.forEach(d => {
        let dateStr = d.dateObj.toDateString();
        let otherYogas = d.yogas.filter(y => !y.name.startsWith(selectedYoga));

        let badges = otherYogas.map(y => {
            let color = y.type === 'shubh' ? 'var(--green-shubh)' : y.type === 'ashubh' ? 'var(--red-ashubh)' : 'var(--amber-mixed)';
            return `<span style="color:${color}; font-weight:bold;" title="${y.fruit}">${y.name}</span>`;
        }).join('<span style="color:var(--text-main);">, </span>');

        if (otherYogas.length === 0) badges = '<span style="color:var(--text-muted); font-size:12px;">None</span>';

        tableHtml += `
            <tr style="border-bottom:1px solid #eee;">
                <td style="padding:10px; font-weight:bold; white-space:nowrap;">${dateStr}</td>
                <td style="padding:10px;">${badges}</td>
            </tr>
        `;
    });

    tableHtml += `</tbody></table></div>`;
    resContainer.innerHTML = tableHtml;
};

</script>

        setInterval(() => {
            let dt = new Date();
            let badge = document.getElementById('currentDateTimeBadge');
            if (badge) badge.innerText = "Current Time: " + dt.toLocaleString();
        }, 1000);
    </script>
